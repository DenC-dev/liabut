name: Release data checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate committed corpus and estimate references
        run: python qa/check_release.py
      - name: Benchmark automatic cognate clusters against expert judgments
        run: python qa/benchmark_cognates.py
      - name: Ensure benchmark output is reproducible
        run: git diff --exit-code -- qa/cognate_benchmark.json
      - name: Summarize existing classification sensitivity analyses
        run: python qa/classification_sensitivity.py
      - name: Ensure sensitivity report is reproducible
        run: git diff --exit-code -- qa/classification_sensitivity.json
